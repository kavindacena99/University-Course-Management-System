openapi: 3.0.3
info:
  title: University Course Management - Authentication Service
  version: 1.1.0
  description: |
    Authentication, session, role, permission, and audit APIs.
    Internal endpoints are not exposed by the NGINX gateway and require
    HMAC service authentication.
servers:
  - url: http://localhost:8080
    description: NGINX gateway
  - url: http://localhost:8081
    description: Direct service (development only)
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /api/v1/auth/login:
    post:
      summary: Log in
      security: []
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/EligibilityUnavailable'
  /api/v1/auth/refresh:
    post:
      summary: Rotate the refresh token
      security: []
      tags: [Authentication]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Rotated tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/EligibilityUnavailable'
  /api/v1/auth/logout:
    post:
      summary: Log out the current session
      security: []
      tags: [Authentication]
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout-all:
    post:
      summary: Revoke all sessions for the current user
      tags: [Authentication]
      responses:
        '204':
          description: Sessions revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/activate:
    post:
      summary: Activate an account and set its password
      security: []
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Account activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/auth/password/forgot:
    post:
      summary: Request a password reset
      security: []
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Request accepted
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/password/reset:
    post:
      summary: Reset a password with an action token
      security: []
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/auth/password/change:
    post:
      summary: Change the current user's password
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      summary: Get the current authenticated user
      tags: [Authentication]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/sessions:
    get:
      summary: List active sessions for the current user
      tags: [Sessions]
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/sessions/{id}:
    delete:
      summary: Revoke one of the current user's sessions
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/auth/roles:
    get:
      summary: List roles
      tags: [Administration]
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/auth/permissions:
    get:
      summary: List permissions
      tags: [Administration]
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/auth/roles/{code}/permissions:
    get:
      summary: Get permissions assigned to a role
      tags: [Administration]
      parameters:
        - $ref: '#/components/parameters/RoleCode'
        - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: Role permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: string
                  permissions:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Replace a role's permissions
      description: Revokes active sessions of users holding the role.
      tags: [Administration]
      parameters:
        - $ref: '#/components/parameters/RoleCode'
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Updated role permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: string
                  permissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/auth/users/{id}/roles:
    put:
      summary: Replace a user's roles
      tags: [Administration]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/auth/users/{id}/unlock:
    post:
      summary: Unlock a locked account
      tags: [Administration]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: Unlocked user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/auth/users/{id}/sessions:
    delete:
      summary: Revoke all sessions for a user
      tags: [Administration]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '204':
          description: Sessions revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/auth/audit:
    get:
      summary: List audit events
      tags: [Audit]
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  total:
                    type: integer
                    format: int64
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /internal/users:
    post:
      summary: Provision a user credential record
      description: Internal HMAC-authenticated endpoint restricted to user-service.
      security: []
      tags: [Internal]
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ServiceTimestamp'
        - $ref: '#/components/parameters/ServiceNonce'
        - $ref: '#/components/parameters/ServiceSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionUserRequest'
      responses:
        '200':
          description: Provisioned user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/events/users:
    post:
      summary: Apply a user lifecycle event
      description: Internal HMAC-authenticated endpoint restricted to user-service.
      security: []
      tags: [Internal]
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ServiceTimestamp'
        - $ref: '#/components/parameters/ServiceNonce'
        - $ref: '#/components/parameters/ServiceSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserEvent'
      responses:
        '200':
          description: Event processed or deduplicated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [processed, duplicate, stale]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/users/{id}/lecturer-eligibility:
    get:
      summary: Check active lecturer role for Course Service
      description: Internal HMAC-authenticated endpoint restricted to course-service. Course Service separately checks live registration approval with User Service.
      security: []
      tags: [Internal]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ServiceTimestamp'
        - $ref: '#/components/parameters/ServiceNonce'
        - $ref: '#/components/parameters/ServiceSignature'
      responses:
        '200':
          description: Role and activation result
          content:
            application/json:
              schema:
                type: object
                required: [user_id, eligible]
                properties:
                  user_id: { type: string, format: uuid }
                  eligible: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
  parameters:
    AuthorizationHeader:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        enum: [ADMIN, STAFF, LECTURER, STUDENT]
    ServiceId:
      name: X-Service-Id
      in: header
      required: true
      schema:
        type: string
    ServiceTimestamp:
      name: X-Service-Timestamp
      in: header
      required: true
      schema:
        type: string
    ServiceNonce:
      name: X-Service-Nonce
      in: header
      required: true
      schema:
        type: string
    ServiceSignature:
      name: X-Service-Signature
      in: header
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EligibilityUnavailable:
      description: User eligibility cannot be verified
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        refresh_expires_in:
          type: integer
        csrf_token:
          type: string
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        registration_status:
          type: string
          enum: [pending, approved, rejected, suspended]
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        user_agent:
          type: string
        ip_address:
          type: string
        current:
          type: boolean
    Role:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
    Permission:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        actor_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        event_type:
          type: string
        success:
          type: boolean
        details:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    ProvisionUserRequest:
      type: object
      required: [user_id, email, registration_status, version]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        registration_status:
          type: string
          enum: [pending, approved, rejected, suspended]
        version:
          type: integer
          format: int64
        password:
          type: string
          format: password
        roles:
          type: array
          items:
            type: string
    UserEvent:
      type: object
      required: [event_id, event_type, occurred_at, user]
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
            - user.approved
            - user.rejected
            - user.suspended
            - user.reinstated
            - user.profile_updated
        occurred_at:
          type: string
          format: date-time
        user:
          type: object
          required: [user_id, email, registration_status, version]
          properties:
            user_id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            first_name:
              type: string
            last_name:
              type: string
            registration_status:
              type: string
              enum: [pending, approved, rejected, suspended]
            version:
              type: integer
              format: int64
