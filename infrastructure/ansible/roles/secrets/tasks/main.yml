---
- name: Find optional environment-specific encrypted variables
  ansible.builtin.stat:
    path: '{{ inventory_dir }}/vault.yml'
  register: vault_status

- name: Read only the Vault envelope for verification
  ansible.builtin.slurp:
    src: '{{ inventory_dir }}/vault.yml'
  register: vault_envelope
  no_log: true
  when: vault_status.stat.exists

- name: Reject plaintext secret-variable files
  ansible.builtin.assert:
    that: "(vault_envelope.content | b64decode).startswith('$ANSIBLE_VAULT;')"
    fail_msg: vault.yml must be encrypted with Ansible Vault.
  no_log: true
  when: vault_status.stat.exists

- name: Load encrypted deployment variables without logging them
  ansible.builtin.include_vars:
    file: '{{ inventory_dir }}/vault.yml'
  no_log: true
  when: vault_status.stat.exists

- name: Reject cross-environment secret destinations
  ansible.builtin.assert:
    that:
      - platform_environment != 'dev'
      - item.path is match('^(\.env|runtime/[a-zA-Z0-9_./-]+)$')
      - "'..' not in item.path"
  loop: '{{ vault_environment_files | default([]) }}'
  no_log: true

- name: Create restricted secret parent directories
  ansible.builtin.file:
    path: '{{ platform_root }}/infrastructure/environments/{{ environment_directory }}/{{ item.path | dirname }}'
    state: directory
    mode: '0700'
  loop: '{{ vault_environment_files | default([]) }}'
  no_log: true

- name: Materialize environment-specific Vault files
  ansible.builtin.copy:
    content: '{{ item.content }}'
    dest: '{{ platform_root }}/infrastructure/environments/{{ environment_directory }}/{{ item.path }}'
    mode: "{{ '0444' if item.path == 'runtime/keys/jwt-private.pem' else '0600' }}"
  loop: '{{ vault_environment_files | default([]) }}'
  no_log: true

- name: Validate environment configuration without exposing secrets
  ansible.builtin.command:
    argv:
      - '{{ ansible_playbook_python }}'
      - '{{ platform_root }}/infrastructure/scripts/platformctl.py'
      - config
      - --environment
      - '{{ platform_environment }}'
  changed_when: false
  check_mode: false
