# Local isolated rehearsal. Use platformctl.py with an explicit environment.
x-runtime: &runtime
  read_only: true
  cap_drop: [ALL]
  pids_limit: 128
  mem_limit: 384m
  cpus: 1.0
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  environment:
    APP_ENV: production
    LOG_LEVEL: info

services:
  auth:
    <<: *runtime
    volumes: !reset []
    secrets:
      - auth_signing_key
  user:
    <<: *runtime
  course:
    <<: *runtime
  enrollment:
    <<: *runtime
  assessment:
    <<: *runtime
  analytics:
    <<: *runtime
  frontend:
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    pids_limit: 64
    mem_limit: 128m
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=4m
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:?set FRONTEND_PORT}:80"
    volumes:
      - ${FRONTEND_CONFIG_FILE:?set FRONTEND_CONFIG_FILE}:/etc/nginx/conf.d/default.conf:ro
  gateway:
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    pids_limit: 64
    mem_limit: 128m
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=4m
    ports: !override
      - "127.0.0.1:${GATEWAY_PORT:?set GATEWAY_PORT}:8080"
    volumes:
      - ${GATEWAY_CONFIG_FILE:?set GATEWAY_CONFIG_FILE}:/etc/nginx/nginx.conf:ro

  auth-db:
    cap_drop: [NET_RAW]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
  user-db:
    cap_drop: [NET_RAW]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
  course-db:
    cap_drop: [NET_RAW]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
  enrollment-db:
    cap_drop: [NET_RAW]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
  assessment-db:
    cap_drop: [NET_RAW]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
  analytics-db:
    cap_drop: [NET_RAW]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
  minio:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m

secrets:
  auth_signing_key:
    file: ${AUTH_PRIVATE_KEY_FILE:?set AUTH_PRIVATE_KEY_FILE}
