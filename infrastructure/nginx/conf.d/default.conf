server {
    listen 8080;
    server_name localhost;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;

    limit_req zone=api_general burst=60 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_redirect off;

    location = /api/v1/auth/login {
        limit_req zone=auth_login burst=6 nodelay;
        include snippets/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8081;
    }

    location = /api/v1/auth/forgot-password {
        limit_req zone=auth_login burst=6 nodelay;
        include snippets/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8081;
    }

    location /api/v1/auth/ {
        include snippets/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8081;
    }

    location /api/v1/admin/auth/ {
        include snippets/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8081;
    }

    location = /api/v1/users {
        limit_req zone=auth_register burst=3 nodelay;
        include snippets/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8082;
    }

    location /api/v1/users/ {
        include snippets/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8082;
    }

    location = /api/v1/admin/users {
        include snippets/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8082;
    }

    location /api/v1/admin/users/ {
        include snippets/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8082;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
