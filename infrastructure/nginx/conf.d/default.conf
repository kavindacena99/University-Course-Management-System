server {
    listen 8080;
    server_name localhost;

    location /api/v1/auth/ {
        include snippets/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8081/;
    }

    location /api/v1/users/ {
        include snippets/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8082/;
    }
}