# Host-run upstreams. Each service binds to loopback by default, so NGINX
# started on the host reaches it directly. One group per service keeps routing
# independent and allows additional instances to be added later.
#
# Docker deployments use compose/00-upstreams.conf instead.

upstream auth_service {
    least_conn;
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream user_service {
    least_conn;
    server 127.0.0.1:8082 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream course_service {
    least_conn;
    server 127.0.0.1:8083 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream enrollment_service {
    least_conn;
    server 127.0.0.1:8084 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream assessment_service {
    least_conn;
    server 127.0.0.1:8085 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream analytics_service {
    least_conn;
    server 127.0.0.1:8086 max_fails=3 fail_timeout=10s;
    keepalive 32;
}
