# Public API gateway server.
#
# Routing is service-level: one location per service API prefix. The only
# endpoint-specific locations are the security-sensitive login, forgot-password,
# and registration endpoints, which add a stricter per-IP limit on top of the
# server-level general limit. A location that declares limit_req does not
# inherit the server-level limit, so those locations declare both.
#
# proxy_pass intentionally has no URI component so the original /api/v1/...
# path is forwarded unchanged; the Gin services expect the full prefix.

server {
    listen 8080;
    server_name _;

    include snippets/security-headers.conf;

    limit_req zone=api_general burst=60 nodelay;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_redirect off;

    # ---------------------------------------------------------------------
    # Authentication Service
    # ---------------------------------------------------------------------
    location = /api/v1/auth/login {
        limit_req zone=api_general burst=60 nodelay;
        limit_req zone=auth_login burst=6 nodelay;
        include snippets/proxy-headers.conf;
        proxy_pass http://auth_service;
    }

    location = /api/v1/auth/password/forgot {
        limit_req zone=api_general burst=60 nodelay;
        limit_req zone=auth_login burst=6 nodelay;
        include snippets/proxy-headers.conf;
        proxy_pass http://auth_service;
    }

    location /api/v1/auth/ {
        include snippets/proxy-headers.conf;
        proxy_pass http://auth_service;
    }

    location /api/v1/admin/auth/ {
        include snippets/proxy-headers.conf;
        proxy_pass http://auth_service;
    }

    # ---------------------------------------------------------------------
    # User Service
    # ---------------------------------------------------------------------
    location = /api/v1/users {
        limit_req zone=api_general burst=60 nodelay;
        limit_req zone=auth_register burst=3 nodelay;
        include snippets/proxy-headers.conf;
        proxy_pass http://user_service;
    }

    location /api/v1/users/ {
        include snippets/proxy-headers.conf;
        proxy_pass http://user_service;
    }

    location = /api/v1/admin/users {
        include snippets/proxy-headers.conf;
        proxy_pass http://user_service;
    }

    location /api/v1/admin/users/ {
        include snippets/proxy-headers.conf;
        proxy_pass http://user_service;
    }

    # ---------------------------------------------------------------------
    # Course Service
    # ---------------------------------------------------------------------
    location = /api/v1/courses {
        include snippets/proxy-headers.conf;
        proxy_pass http://course_service;
    }

    location /api/v1/courses/ {
        include snippets/proxy-headers.conf;
        proxy_pass http://course_service;
    }

    location = /api/v1/offerings {
        include snippets/proxy-headers.conf;
        proxy_pass http://course_service;
    }

    location = /api/v1/admin/courses {
        include snippets/proxy-headers.conf;
        proxy_pass http://course_service;
    }

    location /api/v1/admin/courses/ {
        include snippets/proxy-headers.conf;
        proxy_pass http://course_service;
    }

    location = /api/v1/admin/offerings {
        include snippets/proxy-headers.conf;
        proxy_pass http://course_service;
    }

    location /api/v1/admin/offerings/ {
        include snippets/proxy-headers.conf;
        proxy_pass http://course_service;
    }

    # ---------------------------------------------------------------------
    # Enrollment Service
    #
    # These nested offering resources belong to Enrollment, not Course, so
    # they are the only routing exceptions under the /api/v1/offerings/
    # prefix. They must be declared as regex locations.
    # ---------------------------------------------------------------------
    location ~ ^/api/v1/offerings/[^/]+/enrollments$ {
        include snippets/proxy-headers.conf;
        proxy_pass http://enrollment_service;
    }

    location = /api/v1/enrollments {
        include snippets/proxy-headers.conf;
        proxy_pass http://enrollment_service;
    }

    location /api/v1/enrollments/ {
        include snippets/proxy-headers.conf;
        proxy_pass http://enrollment_service;
    }

    location ~ ^/api/v1/students/[^/]+/enrollments$ {
        include snippets/proxy-headers.conf;
        proxy_pass http://enrollment_service;
    }

    # ---------------------------------------------------------------------
    # Assessment Service
    #
    # Assessment owns nested offering assessments/results and its own root
    # prefixes. Upload and final-result import limits are raised here; the
    # service still enforces its own MAX_REQUEST_BYTES and MAX_UPLOAD_BYTES.
    # ---------------------------------------------------------------------
    location ~ ^/api/v1/offerings/[^/]+/assessments(?:/.*)?$ {
        client_max_body_size 21m;
        include snippets/proxy-headers.conf;
        proxy_pass http://assessment_service;
    }

    location ~ ^/api/v1/offerings/[^/]+/results(?:/.*)?$ {
        client_max_body_size 6m;
        include snippets/proxy-headers.conf;
        proxy_pass http://assessment_service;
    }

    location /api/v1/assessments/ {
        client_max_body_size 21m;
        include snippets/proxy-headers.conf;
        proxy_pass http://assessment_service;
    }

    location /api/v1/submissions/ {
        client_max_body_size 21m;
        include snippets/proxy-headers.conf;
        proxy_pass http://assessment_service;
    }

    # ---------------------------------------------------------------------
    # Analytics Service
    # ---------------------------------------------------------------------
    location /api/v1/analytics/ {
        include snippets/proxy-headers.conf;
        proxy_pass http://analytics_service;
    }

    # Generic offering routes remain owned by Course. Regex locations above
    # take precedence for the nested resources they match.
    location /api/v1/offerings/ {
        include snippets/proxy-headers.conf;
        proxy_pass http://course_service;
    }

    # ---------------------------------------------------------------------
    # Gateway health and fallback
    #
    # `return` runs in the rewrite phase, before access-phase limit_req, so
    # these cheap responses are intentionally exempt from API rate limiting.
    # ---------------------------------------------------------------------
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
