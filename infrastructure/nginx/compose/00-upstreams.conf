# Docker Compose upstreams.
#
# Docker's embedded DNS (127.0.0.11) resolves a Compose service name to every
# running replica. `resolve` with a shared zone re-resolves periodically so
# containers added, removed, or recreated by Compose are picked up without
# restarting NGINX. This requires NGINX 1.27.3 or newer (the gateway image uses
# the stable Alpine tag, which satisfies that requirement).

resolver 127.0.0.11 valid=10s ipv6=off;

upstream auth_service {
    zone auth_service 64k;
    least_conn;
    server auth:8081 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream user_service {
    zone user_service 64k;
    least_conn;
    server user:8082 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream course_service {
    zone course_service 64k;
    least_conn;
    server course:8083 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream enrollment_service {
    zone enrollment_service 64k;
    least_conn;
    server enrollment:8084 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream assessment_service {
    zone assessment_service 64k;
    least_conn;
    server assessment:8085 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream analytics_service {
    zone analytics_service 64k;
    least_conn;
    server analytics:8086 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}
