# Global API gateway configuration.
#
# Host-run:  nginx -p infrastructure/nginx/ -c nginx.conf
# Container: baked into infrastructure/nginx/Dockerfile.
#
# Environment-specific upstreams live in conf.d/00-upstreams.conf. The Docker
# image replaces that file with compose/00-upstreams.conf.

user nginx;
worker_processes auto;

error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    # General API limit applies at server level. Authentication and
    # registration limits are additional per-IP safeguards on the
    # security-sensitive endpoints.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=12r/m;
    limit_req_zone $binary_remote_addr zone=auth_register:10m rate=6r/m;
    limit_req_status 429;

    access_log logs/access.log;

    # When NGINX is behind a trusted cloud load balancer, restore the client
    # address here before enabling these directives:
    # set_real_ip_from <trusted-lb-cidr>;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    include conf.d/*.conf;
}
