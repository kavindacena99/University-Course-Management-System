# The gateway is the public edge, so it overwrites client-supplied forwarding
# headers instead of appending to them. When a trusted load balancer is placed
# in front, enable set_real_ip_from/real_ip_header in nginx.conf first so
# $remote_addr is restored to the original client address.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
