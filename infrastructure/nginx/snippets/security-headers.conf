# Security headers for API responses. `always` keeps them on error responses
# generated by NGINX as well as successful upstream responses.
#
# These headers are intentionally API-oriented. If this gateway later serves
# the frontend directly, move the frontend CSP and caching policy to that
# server/location instead of loosening these API defaults.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
add_header Cache-Control "no-store" always;
