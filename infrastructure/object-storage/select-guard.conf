# S3 Select is unused by this application. Block its POST query key before Silo.
# Match each letter's single URL-encoded form too: Go decodes query keys once.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    map $args $select_key {
        default 0;
        ~*(^|&)(s|%73|%53)(e|%65|%45)(l|%6c|%4c)(e|%65|%45)(c|%63|%43)(t|%74|%54)(=|&|$) 1;
    }
    map "$request_method:$select_key" $reject_select {
        default 0;
        "POST:1" 1;
    }
    server {
        listen 9000;
        client_max_body_size 0;
        location / {
            if ($reject_select) {
                add_header X-S3-Select-Guard denied always;
                return 403;
            }
            proxy_pass http://127.0.0.1:19000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
