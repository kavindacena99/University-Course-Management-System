name: Publish application images to GHCR

# Manual entry point for the same build, scan and publish pipeline used by main.
# The called CI workflow repeats the protected-ref and policy checks before it
# authenticates to GHCR. No source SHA or artifact-run input is accepted.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validated-publication:
    if: >-
      github.repository == 'kavindacena99/University-Course-Management-System' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.ref_protected
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write
