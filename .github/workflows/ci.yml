name: CI

on:
  pull_request:
  push:
    tags-ignore: ['**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [security-and-authentication, user, course, enrollment, assessment, analytics]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Formatting, dependency integrity, tests and vet
        run: |
          test -z "$(gofmt -l .)"
          go mod download
          go mod verify
          go mod tidy -diff
          set -o pipefail
          go test -json ./... | tee "$RUNNER_TEMP/backend-test.json"
          go vet ./...
          go build -trimpath -o "$RUNNER_TEMP/service" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-tests-${{ matrix.service }}
          path: ${{ runner.temp }}/backend-test.json
          retention-days: 14
      - name: Summarize passed, failed and skipped tests
        if: always()
        shell: python
        run: |
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'backend-test.json'
          events = [json.loads(line) for line in p.read_text().splitlines()] if p.exists() else []
          counts = {a: sum(e.get('Action') == a and bool(e.get('Test')) for e in events) for a in ('pass', 'fail', 'skip')}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Backend test events: ' + str(counts) + '\nDatabase integration tests need explicit disposable fixtures; skipped tests are not passes.\n')

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.34.3 --activate
      - run: pnpm install --frozen-lockfile
      - name: Run checks when the frontend defines them
        run: |
          node -e "const p=require('./package.json'); for(const s of ['lint','test']) if(!p.scripts[s]) console.log(s+' script is not implemented')"
          pnpm run --if-present lint
          pnpm run --if-present test
        env:
          CI: 'true'
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
      - name: Frontend result
        if: always()
        run: echo 'Frontend job status ${{ job.status }}; API integration and missing lint/unit scripts are tracked separately.' >> "$GITHUB_STEP_SUMMARY"

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r infrastructure/ansible/requirements.txt
      - run: python -m unittest discover -s tests/infrastructure -v
      - name: Scan committed history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --config /repo/.gitleaks.toml --redact --no-banner --log-opts=--all
      - name: Validate legacy and consolidated Compose configurations with isolated inputs
        run: python -B infrastructure/scripts/ci_models.py
      - name: Ansible inventories and playbook syntax
        working-directory: infrastructure/ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/infrastructure/ansible/ansible.cfg
        run: |
          for inventory in dev qa prodlike; do
            ansible-inventory -i "inventories/$inventory/hosts.yml" --graph
            for playbook in deploy validate health-check rollback; do
              ansible-playbook -i "inventories/$inventory/hosts.yml" "playbooks/$playbook.yml" --syntax-check
            done
          done
      - name: Verify clean tracked inputs
        run: git diff --check
      - name: Summarize infrastructure checks
        run: echo "Ten isolated Compose configurations and safety tests validated; no application deployment or publishing." >> "$GITHUB_STEP_SUMMARY"

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: auth, context: services/security-and-authentication, file: services/security-and-authentication/Dockerfile}
          - {name: user, context: services/user, file: services/user/Dockerfile}
          - {name: course, context: services/course, file: services/course/Dockerfile}
          - {name: enrollment, context: services/enrollment, file: services/enrollment/Dockerfile}
          - {name: assessment, context: services/assessment, file: services/assessment/Dockerfile}
          - {name: analytics, context: services/analytics, file: services/analytics/Dockerfile}
          - {name: frontend, context: frontend, file: frontend/Dockerfile}
          - {name: postgres, context: infrastructure/postgres, file: infrastructure/postgres/Dockerfile}
          - {name: gateway, context: infrastructure/nginx, file: infrastructure/nginx/Dockerfile}
          - {name: assessment-minio-init, context: services/assessment, file: services/assessment/MinIOInit.Dockerfile}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: ucm-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan image dependencies
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$RUNNER_TEMP:/reports"
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --scanners vuln --severity HIGH,CRITICAL
          --format json --output /reports/image-scan.json --exit-code 1 ucm-${{ matrix.name }}:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-scan-${{ matrix.name }}
          path: ${{ runner.temp }}/image-scan.json
          retention-days: 14
      - name: Image result
        if: always()
        run: echo 'Image ${{ matrix.name }} build/scan status ${{ job.status }}; HIGH/CRITICAL findings fail the job; no publication.' >> "$GITHUB_STEP_SUMMARY"
